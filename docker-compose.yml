# Sized for a single small EC2 instance (t3.small, 2 GB RAM).
# Images are built by GitHub Actions and pulled from GHCR (see
# .github/workflows/deploy-vegecoop-ec2.yml); `build:` is kept so
# `docker compose build` still works locally.
x-api-common: &api-common
  image: ${REGISTRY:-ghcr.io/arabbohara}/vegecoop-api:${IMAGE_TAG:-latest}
  env_file:
    - ./apps/api/.env
  environment:
    # Celery uses Redis DB 1 as its queue instead of RabbitMQ.
    # DB 0 is the Django cache, which `clear_cache` flushes on every API start.
    AMQP_URL: redis://plane-redis:6379/1

services:
  web:
    container_name: web
    image: ${REGISTRY:-ghcr.io/arabbohara}/vegecoop-web:${IMAGE_TAG:-latest}
    build:
      context: .
      dockerfile: ./apps/web/Dockerfile.web
    restart: always
    mem_limit: 64m
    depends_on:
      - api

  admin:
    container_name: admin
    image: ${REGISTRY:-ghcr.io/arabbohara}/vegecoop-admin:${IMAGE_TAG:-latest}
    build:
      context: .
      dockerfile: ./apps/admin/Dockerfile.admin
    restart: always
    mem_limit: 64m
    depends_on:
      - api
      - web

  space:
    container_name: space
    image: ${REGISTRY:-ghcr.io/arabbohara}/vegecoop-space:${IMAGE_TAG:-latest}
    build:
      context: .
      dockerfile: ./apps/space/Dockerfile.space
    restart: always
    mem_limit: 64m
    depends_on:
      - api
      - web

  api:
    <<: *api-common
    container_name: api
    build:
      context: ./apps/api
      dockerfile: Dockerfile.api
    restart: always
    command: ./bin/docker-entrypoint-api.sh
    mem_limit: 600m
    environment:
      AMQP_URL: redis://plane-redis:6379/1
      GUNICORN_WORKERS: 2
    depends_on:
      plane-db:
        condition: service_started
      plane-redis:
        condition: service_started
      # Start the new code only after its migrations are applied
      migrator:
        condition: service_completed_successfully

  # One process runs both the Celery worker and the beat scheduler (-B),
  # replacing the separate worker and beat-worker containers.
  worker:
    <<: *api-common
    container_name: bgworker
    restart: always
    command: >
      bash -c "python manage.py wait_for_db &&
      python manage.py wait_for_migrations &&
      exec celery -A plane worker -B -l info --concurrency=2"
    mem_limit: 500m
    depends_on:
      - api
      - plane-db
      - plane-redis

  migrator:
    <<: *api-common
    container_name: plane-migrator
    restart: no
    command: ./bin/docker-entrypoint-migrator.sh
    depends_on:
      - plane-db
      - plane-redis

  live:
    container_name: plane-live
    image: ${REGISTRY:-ghcr.io/arabbohara}/vegecoop-live:${IMAGE_TAG:-latest}
    build:
      context: .
      dockerfile: ./apps/live/Dockerfile.live
    restart: always
    mem_limit: 200m
    env_file:
      - ./apps/live/.env
    depends_on:
      - plane-redis

  plane-db:
    container_name: plane-db
    image: postgres:15.7-alpine
    restart: always
    # Small-instance tuning: 1000 connections reserved memory nobody used.
    command: >
      postgres -c max_connections=100
      -c shared_buffers=128MB
      -c effective_cache_size=384MB
      -c work_mem=4MB
      -c maintenance_work_mem=32MB
    mem_limit: 400m
    volumes:
      - pgdata:/var/lib/postgresql/data
    env_file:
      - .env
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      PGDATA: /var/lib/postgresql/data

  plane-redis:
    container_name: plane-redis
    image: valkey/valkey:7.2.11-alpine
    restart: always
    mem_limit: 200m
    volumes:
      - redisdata:/data

  plane-minio:
    container_name: plane-minio
    image: minio/minio
    restart: always
    command: server /export --console-address ":9090"
    mem_limit: 200m
    volumes:
      - uploads:/export
    environment:
      MINIO_ROOT_USER: ${AWS_ACCESS_KEY_ID}
      MINIO_ROOT_PASSWORD: ${AWS_SECRET_ACCESS_KEY}

  # Comment this if you already have a reverse proxy running
  proxy:
    container_name: proxy
    image: ${REGISTRY:-ghcr.io/arabbohara}/vegecoop-proxy:${IMAGE_TAG:-latest}
    build:
      context: ./apps/proxy
      dockerfile: Dockerfile.ce
    restart: always
    mem_limit: 96m
    env_file:
      - .env
    ports:
      - ${LISTEN_HTTP_PORT}:80
      - ${LISTEN_HTTPS_PORT}:443
    environment:
      FILE_SIZE_LIMIT: ${FILE_SIZE_LIMIT:-5242880}
      BUCKET_NAME: ${AWS_S3_BUCKET_NAME:-uploads}
    depends_on:
      - web
      - api
      - space
      - admin

volumes:
  pgdata:
  redisdata:
  uploads:
